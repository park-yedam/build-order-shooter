<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공정 슈터</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <canvas id="canvas" width="480" height="720"></canvas>
    <aside id="panel">
      <h2 id="stage-title"></h2>
      <div id="building"></div>
    </aside>
  </main>
  <!-- 시작·결과 화면 (결과 화면 내용은 game.js가 채운다) -->
  <div id="overlay" class="overlay">
    <div id="card" class="card">
      <h1>공정 슈터</h1>
      <p>하늘에서 떨어지는 공정 블록 중 <b>지금 해야 할 공정</b>만 맞히세요. 순서가 틀린 블록을 맞히면 안전 헬멧을 잃습니다.</p>
      <ul>
        <li>PC: ← → 이동, 스페이스 발사</li>
        <li>모바일: 화면을 누른 채 좌우로 끌면 이동 + 자동 발사</li>
        <li>스테이지 1은 다음 공정이 표시되고, 2·3은 숨겨집니다.</li>
      </ul>
      <button type="button">게임 시작 (Enter)</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
